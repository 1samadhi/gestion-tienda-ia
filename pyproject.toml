[project]
name = "gestion-tienda-ia"
version = "0.1.0"
description = "Gestion de tienda con agentes CrewAI, observabilidad y seguridad - ISY0101 Duoc UC"
requires-python = ">=3.11"
dependencies = [
    "crewai[litellm]>=1.15.0",
    "python-dotenv>=1.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.140.0",
    "streamlit>=1.38.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
# Solo para MEMORIA_CREW=true (embeddings locales). Arrastra torch: el
# servidor se instala sin este grupo.
memoria = ["sentence-transformers>=3.0.0"]

[tool.uv]
package = false
default-groups = ["dev", "memoria"]
